# Based on the custom workflow documented at https://github.com/flathub-infra/flatpak-external-data-checker
name: external-data-checker
on:
# Disable the scheduled runs because the security settings on the flathub org prevent our in-repo
# "auto-update" workflow from automatically running on pull requests opened by this workflow
#  schedule:
#    - cron: "55 3,11,19 * * *"
  workflow_dispatch:

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        branch: [ master ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.branch }}

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --require-important-update --never-fork org.sabnzbd.sabnzbd.yaml
