app-id: org.sabnzbd.sabnzbd
command: SABnzbd.py
runtime: org.freedesktop.Platform
# Remember to also update both env and container image in auto-update.yaml on runtime-version bumps
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
rename-desktop-file: sabnzbd.desktop
rename-icon: sabnzbd
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --system-talk-name=org.freedesktop.login1
  - --system-talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.Avahi
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.ayatana.indicator.application
  - --filesystem=xdg-download
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  - --persist=.sabnzbd
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /lib/avahi
  - /man
  - /share/man
  - /share/doc
  # Parts of SABnzbd not needed at runtime
  - /bin/licenses
  - /bin/po
  - /bin/scripts
  - /bin/tests
  - /bin/tools
  - /bin/README.mkd
  - /bin/*.txt
cleanup-commands:
  # Scriptlets installed by pip, not needed by SABnzbd
  - find ${FLATPAK_DEST}/bin -maxdepth 1 -type f -executable -not -name 'SABnzbd.py'
    -not -name '7zz' -not -name 'par2' -not -name 'unrar' -ls -delete
  # Leftover broken symlinks
  - find ${FLATPAK_DEST}/bin -maxdepth 1 -type l ! -exec test -e {} \; -ls -delete
modules:
  # Assorted pypi dependencies, generated from requirements-*.txt
  - pypi-dependencies-flatpak.json
  - pypi-dependencies-cryptography.json
  - pypi-dependencies-orjson.json
  # SABnzbd dependencies, generated from requirements.txt
  - pypi-dependencies.json

  - name: dbus-run-session
    buildsystem: cmake
    cleanup: ['*']
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/dbus/dbus/-/archive/dbus-1.16.2/dbus-dbus-1.16.2.tar.gz
        sha256: d77cc71acd93e85f2bd2a6fe3a40e5bd023519e3e9fa9b5361e7109f42b74060
        x-checker-data:
          type: anitya
          project-id: 5356
          url-template: https://gitlab.freedesktop.org/dbus/dbus/-/archive/dbus-$version/dbus-dbus-$version.tar.gz

  - name: dbus-python
    buildsystem: autotools
    sources:
      - type: archive
        url: https://dbus.freedesktop.org/releases/dbus-python/dbus-python-1.4.0.tar.xz
        sha256: c36b28f10ffcc8f1f798aca973bcc132f91f33eb9b6b8904381b4077766043d5
        x-checker-data:
          type: anitya
          project-id: 402
          url-template: https://dbus.freedesktop.org/releases/dbus-python/dbus-python-$version.tar.xz

  # Buildsystem used by cryptography, orjson
  - name: maturin
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/maturin/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path ./Cargo.toml
      - cargo --offline build --release
      - install -Dm755 target/release/maturin -t ${FLATPAK_DEST}/bin
      - install -Dm644 maturin/__init__.py -t ${FLATPAK_DEST}/lib/python$(python -c
        'import sys; print("%s.%s" %sys.version_info[0:2])')/site-packages/maturin/
    sources:
      - cargo-sources-maturin.json
      - type: archive
        # Remember to update the associated Cargo-*.lock and regenerate cargo-sources-*.json on every version bump!
        url: https://files.pythonhosted.org/packages/b9/c8/22e5e21b2679c9bce6415ca578034ca2cc9316be0642ae21e051a2d5198c/maturin-1.15.0.tar.gz
        sha256: 94b26cc8e8aba61a5f2099715fe640e18c5f678e9a500408b38761263954228a
        x-checker-data:
          type: pypi
          name: maturin
          stable-only: true

  - name: orjson
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/orjson/cargo
        CARGO_NET_OFFLINE: 'true'
        RUST_BACKTRACE: '1'
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links=file://${PWD}
        --prefix=${FLATPAK_DEST} orjson --no-build-isolation
    sources:
      - cargo-sources-orjson.json
      - type: file
        # Remember to update the associated Cargo-*.lock and regenerate cargo-sources-*.json on every version bump!
        url: https://files.pythonhosted.org/packages/0f/f3/742fb1f62b825f2c010697eaf4e828004bc2a81e7e806666989c132c7c42/orjson-3.12.0.tar.gz
        sha256: d14203fb1aae2ad9b3d52f8a0e82aeb10197ef1c9bc61da7f358bd70b00123d5
        x-checker-data:
          type: pypi
          name: orjson
          stable-only: true

  - name: cryptography
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/cryptography/cargo
        CARGO_NET_OFFLINE: 'true'
        RUST_BACKTRACE: '1'
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "cryptography" --no-build-isolation
    sources:
      - cargo-sources-cryptography.json
      - type: file
        # Remember to update the associated Cargo-*.lock and regenerate cargo-sources-*.json on every version bump!
        url: https://files.pythonhosted.org/packages/bb/ad/5d6702db60b1e40b41ef513b6967ff5848f307d50f8449baf1634f5908f1/cryptography-50.0.1.tar.gz
        sha256: 5dd9bda1c12b4162f6ff568eeb5e0ff956c28d14406e875cfe8a63a2d414ff20
        x-checker-data:
          type: pypi
          name: cryptography
          stable-only: true

  - name: 7zip
    buildsystem: simple
    subdir: CPP/7zip/Bundles/Alone2
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS -f makefile.gcc
      - install -D -m755 ./_o/7zz -t /app/bin
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/archive/refs/tags/26.02.tar.gz
        sha256: 7e5600ad0b21918bc41803bd84d0c2967e097fb7fbaa2e7aeb90beeb1121e54b
        x-checker-data:
          type: anitya
          project-id: 372314
          is-important: true
          stable-only: true
          url-template: https://github.com/ip7z/7zip/archive/refs/tags/$version.tar.gz

  - name: unrar
    no-autogen: true
    make-install-args:
      - DESTDIR=$(FLATPAK_DEST)
    sources:
      - type: archive
        # Find the "UnRAR source" link at https://www.rarlab.com/rar_add.htm
        url: https://www.rarlab.com/rar/unrarsrc-7.2.7.tar.gz
        sha256: 01d903a7dcf413cb2925696d7796e48e38d471f79bfe7ef3ad2aebf6c12dbefd
        x-checker-data:
          type: anitya
          project-id: 13306
          is-important: true
          url-template: https://www.rarlab.com/rar/unrarsrc-$version.tar.gz
      - type: patch
        # Patch origin is Debian, see https://github.com/debian-calibre/unrar-nonfree/tree/master/debian/patches
        path: patches/unrar-fix-buildflags.patch

  - name: par2cmdline-turbo
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/animetosho/par2cmdline-turbo/archive/refs/tags/v1.5.0.tar.gz
        sha256: 38ae0b5158c496c5fe60dfdfdc05ea18516a2efa9c3ea0dc2cd477df498937a3
        x-checker-data:
          type: anitya
          project-id: 372791
          is-important: true
          url-template: https://github.com/animetosho/par2cmdline-turbo/archive/refs/tags/v$version.tar.gz
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf --verbose --force --install

  - name: avahi
    buildsystem: autotools
    config-opts:
      - --with-distro=none
      - --enable-compat-libdns_sd
      - --disable-compat-howl
      - --disable-introspection
      - --disable-qt3
      - --disable-qt4
      - --disable-qt5
      - --disable-gtk
      - --disable-gtk3
      - --disable-core-docs
      - --disable-manpages
      - --disable-libdaemon
      - --disable-libevent
      - --disable-python
      - --disable-pygobject
      - --disable-mono
      - --disable-monodoc
      - --disable-autoipd
      - --disable-doxygen-doc
      - --disable-doxygen-dot
      - --disable-doxygen-xml
      - --disable-doxygen-html
      - --disable-manpages
      - --disable-xmltoman
      - --disable-tests
    sources:
      - type: archive
        url: https://www.avahi.org/download/avahi-0.8.tar.gz
        sha256: 060309d7a333d38d951bc27598c677af1796934dbd98e1024e7ad8de798fedda
        x-checker-data:
          type: anitya
          project-id: 147
          stable-only: true
          url-template: https://www.avahi.org/download/avahi-$version.tar.gz

  # Tray icon support, via https://github.com/flathub/shared-modules/
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: sabnzbd
    buildsystem: simple
    build-commands:
      - cp -a * /app/bin/
      - install -Dm644 linux/org.sabnzbd.sabnzbd.appdata.xml /app/share/appdata/org.sabnzbd.sabnzbd.appdata.xml
      # The main icon is automatically renamed to org.sabnzbd.sabnzbd.svg during the flatpak build...
      - install -Dm644 icons/logo-arrow.svg /app/share/icons/hicolor/scalable/apps/sabnzbd.svg
      # ...but the others require names starting with 'org.sabnzbd.sabnzbd.' for flatpak to "export" them
      - install -Dm644 icons/logo-arrow_gray.svg /app/share/icons/hicolor/scalable/apps/org.sabnzbd.sabnzbd.gray.svg
      - install -Dm644 icons/logo-arrow_green.svg /app/share/icons/hicolor/scalable/apps/org.sabnzbd.sabnzbd.green.svg
      - install -Dm644 linux/sabnzbd.desktop /app/share/applications/sabnzbd.desktop
      - desktop-file-edit --set-key=Exec --set-value="SABnzbd.py --browser 1 %F" /app/share/applications/sabnzbd.desktop
    sources:
      - type: archive
        url: https://github.com/sabnzbd/sabnzbd/releases/download/5.1.2/SABnzbd-5.1.2-src.tar.gz
        sha256: bdf1ed947d810b5ac01a2b43b7f39cd11ca6eb6a93b577244a3c021d018d63e4
        x-checker-data:
          type: anitya
          project-id: 44529
          stable-only: true
          is-main-source: true
          url-template: https://github.com/sabnzbd/sabnzbd/releases/download/$version/SABnzbd-$version-src.tar.gz
      - type: patch
        path: patches/sabnzbd_icon_rename.patch
